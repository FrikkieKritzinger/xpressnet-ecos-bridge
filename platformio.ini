[platformio]
; XpressNet-Ecos Bridge Testing Configuration
default_envs = wemos
src_dir = xpressnet_ecos_bridge

; Directory structure
include_dir = xpressnet_ecos_bridge
lib_extra_dirs = libraries

; Global build settings
extra_scripts =

[env:wemos]
; ESP8266 Wemos D1 Mini Production Environment
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; Build flags
build_flags =
    -DENABLE_XPRESSNET=1
    -DENABLE_ECOS_LAN=1
    -DENABLE_DEBUG=0
    -DENABLE_TESTING=0

; Libraries for ESP8266
lib_deps =
    adafruit/Adafruit SSD1306@2.5.7

[env:native]
; Native (Host) Testing Environment
; Compiles and runs on local machine CPU (not ESP8266)
platform = native
test_framework = unity
test_dir = tests
test_ignore = tests/mocks/*

; Build flags for native testing
build_flags =
    -DENABLE_XPRESSNET=1
    -DENABLE_ECOS_LAN=1
    -DENABLE_DEBUG=1
    -DENABLE_TESTING=1
    -std=c++11

; Source files to exclude (Arduino-specific only)
; We'll only compile platform-agnostic files
src_filter =
    +<*>
    -<protocols/*/hardware/*>

; Unity test framework settings
test_build_project_src = yes

[env:debug]
; ESP8266 with Debug Output Enabled (for troubleshooting on hardware)
extends = env:wemos
build_flags =
    -DENABLE_XPRESSNET=1
    -DENABLE_ECOS_LAN=1
    -DENABLE_DEBUG=1
    -DENABLE_TESTING=0
    -DDEBUG_STARTUP=1
    -DDEBUG_XPRESSNET=1
    -DDEBUG_ECOS=1
    -DDEBUG_STATE_ENGINE=1
    -DDEBUG_ECHO_PREVENTION=1
    -DDEBUG_TIMING=1
    -DDEBUG_MEMORY=0
