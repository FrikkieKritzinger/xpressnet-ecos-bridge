[platformio]
; XpressNet-Ecos Bridge Testing Configuration
default_envs = wemos
src_dir = xpressnet_ecos_bridge

; Directory structure
include_dir = xpressnet_ecos_bridge

[env:wemos]
; ESP8266 Wemos D1 Mini Production Environment
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; Without these, opening the monitor pulses DTR/RTS - the same auto-reset
; wiring used during flashing - and silently reboots the board, wiping
; StateEngine/address-map state right as a live test starts.
monitor_rts = 0
monitor_dtr = 0

; lib_extra_dirs must be set per-environment, not under [platformio] - PlatformIO
; 6.1.19 silently ignores it there ("Warning! Ignore unknown configuration option
; lib_extra_dirs"). Only env:wemos needs it - env:native excludes
; xpressnet_interface.cpp entirely, so it never touches libraries/XpressNetMaster.
lib_extra_dirs = libraries

; Build flags
build_flags =
    -DENABLE_XPRESSNET=1
    -DENABLE_ECOS_LAN=1
    -DENABLE_DEBUG=0
    -DENABLE_TESTING=0

; test_support/ (mock_now_ms.cpp, arduino_stub.cpp) exists only to satisfy
; native/test builds - it must never be compiled into real firmware (it
; defines its own fake Serial/ESP/millis, which would collide with the real
; ones here).
build_src_filter =
    +<*>
    -<test_support/*>

; Libraries for ESP8266
lib_deps =
    adafruit/Adafruit SSD1306@2.5.7

[env:native]
; Native (Host) Testing Environment
; Compiles and runs on local machine CPU (not ESP8266)
; NOTE: PlatformIO 6.x hardcodes the test directory to ./test (singular) -
; test_dir is not a supported option, hence the tests/ -> test/ rename.
platform = native
test_framework = unity
test_ignore = test/mocks/* test/native_stubs/*

; Build flags for native testing
; -Itest/native_stubs provides a stand-in <Arduino.h> (Serial/ESP/millis stubs)
; for the handful of production files that unconditionally include it -
; there is no real Arduino core on the native platform.
; -Itest and -Ixpressnet_ecos_bridge let every per-suite test directory
; (test/test_*/...) reach the shared mocks/fixtures and production headers
; via stable paths, regardless of how deep the suite directory is nested.
; --coverage (-fprofile-arcs -ftest-coverage, plus links libgcov) instruments
; every compiled translation unit so gcov/gcovr can report line/branch
; coverage after `pio test` runs. -O0 keeps line mapping accurate.
build_flags =
    -DENABLE_XPRESSNET=1
    -DENABLE_ECOS_LAN=1
    -DENABLE_DEBUG=1
    -DENABLE_TESTING=1
    -std=c++11
    -O0
    --coverage
    -lgcov
    -Itest/native_stubs
    -Itest
    -Ixpressnet_ecos_bridge

; Source files to exclude:
; - protocols/*/hardware/* : Arduino-specific hardware glue
; - display/*, oled_display.cpp : Adafruit_SSD1306/OLED, not exercised by
;   unit tests (oled_display.cpp itself lives at the project root, not
;   under display/, so it needs its own exclusion pattern)
; - *.ino                  : main sketch (setup/loop, own entry point)
; - ecos_interface.cpp / xpressnet_interface.cpp : concrete protocol interfaces
;   with real WiFiClient/HardwareSerial dependencies. CommandRouter talks to
;   these only through the abstract ProtocolInterface, so unit tests exercise
;   it via MockProtocolInterface instead and never need these compiled.
; - eeprom_store.cpp       : real EEPROM.h read/write calls, Arduino-only -
;   the struct/default/validation logic it wraps lives in eeprom_config.cpp
;   instead (no EEPROM.h dependency), which stays in the native build.
; - setup_mode.cpp         : real WiFi AP/ESP8266WebServer/RTC memory/GPIO
;   calls, Arduino-only - the HTML/validation logic it wraps lives in
;   setup_web_form.cpp instead, which stays in the native build.
; - z21lan_interface.cpp   : real WiFiUDP calls, Arduino-only - the packet
;   encode/decode logic it wraps lives in z21_protocol.cpp instead, which
;   stays in the native build.
build_src_filter =
    +<*>
    -<protocols/*/hardware/*>
    -<display/*>
    -<oled_display.cpp>
    -<*.ino>
    -<protocols/ecos/ecos_interface.cpp>
    -<protocols/xpressnet/xpressnet_interface.cpp>
    -<eeprom_store.cpp>
    -<setup_mode.cpp>
    -<protocols/z21lan/z21lan_interface.cpp>

; Unity test framework settings
test_build_src = yes

[env:debug]
; ESP8266 with Debug Output Enabled (for troubleshooting on hardware)
extends = env:wemos
build_flags =
    -DENABLE_XPRESSNET=1
    -DENABLE_ECOS_LAN=1
    -DENABLE_DEBUG=1
    -DENABLE_TESTING=0
    -DDEBUG_STARTUP=1
    -DDEBUG_XPRESSNET=1
    -DDEBUG_ECOS=1
    -DDEBUG_STATE_ENGINE=1
    -DDEBUG_ECHO_PREVENTION=1
    -DDEBUG_TIMING=1
    -DDEBUG_MEMORY=0
